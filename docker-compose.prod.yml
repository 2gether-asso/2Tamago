# Production (or staging) stack, from the published images. Self-contained: the
# server only needs this file and a .env (see .env.example).
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# For a staging instance, use another directory or project name (-p) and .env.
# Only the API runs here, on 127.0.0.1:${API_PORT}: a reverse proxy in front of it
# terminates HTTPS. The web app is static (GitHub Pages).
name: 2tamago-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: tamago
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tamago']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot deployment step: applies the migrations, then the API starts.
  migrate:
    image: ${REGISTRY:-ghcr.io/2gether-asso}/2tamago-api:${TAG:-latest}
    command: ['node', 'dist/migrate.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tamago:${POSTGRES_PASSWORD}@db:5432/tamago
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${REGISTRY:-ghcr.io/2gether-asso}/2tamago-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tamago:${POSTGRES_PASSWORD}@db:5432/tamago
      DATABASE_AUTO_MIGRATE: 'false'
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required (32+ characters)}
      COOKIE_SECURE: 'true'
      # Where the web app is served (CORS, and where sign-in sends players back).
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required, for example https://tamago.example.org}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?}
      DISCORD_REDIRECT_URI: ${API_ORIGIN:?API_ORIGIN is required, for example https://api.example.org}/api/auth/discord/callback
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_WEB_DSN: ${SENTRY_WEB_DSN:-}
      GAME_TIME_SCALE: ${GAME_TIME_SCALE:-1}
      GAME_DEPARTURE: ${GAME_DEPARTURE:-true}
      GAME_TIMEZONE: ${GAME_TIMEZONE:-Europe/Paris}
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
