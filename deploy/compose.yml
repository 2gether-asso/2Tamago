# Production stack: docker compose --env-file .env up -d
name: 2tamago

services:
  web:
    image: ghcr.io/2gether-asso/2tamago-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
    depends_on:
      - api

  api:
    image: ghcr.io/2gether-asso/2tamago-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://tamago:${POSTGRES_PASSWORD}@db:5432/tamago
      COOKIE_SECURE: 'true'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tamago
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tamago
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tamago']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy-data:
  db-data:
