name: GitHub Pages

# Builds the static web app (SvelteKit adapter-static) and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Require the API address
        run: test -n "$API_URL" || { echo "::error::Set the repository variable API_URL"; exit 1; }
        env:
          API_URL: ${{ vars.API_URL }}
      - run: pnpm install --frozen-lockfile --filter @2tamago/web...
      - run: pnpm --filter @2tamago/web build
        env:
          # Public address of the API, for example https://tamago-api.2gether-asso.fr
          VITE_API_URL: ${{ vars.API_URL }}
          # Optional: extra origins the page may call (the host of SENTRY_WEB_DSN), space-separated.
          CSP_CONNECT_SRC: ${{ vars.CSP_CONNECT_SRC }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
