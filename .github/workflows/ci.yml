name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint

  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  e2e-api:
    name: API e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tamago
          POSTGRES_PASSWORD: tamago
          POSTGRES_DB: tamago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tamago"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Against PGlite (the development default)
        run: pnpm --filter @2tamago/api test:e2e
      - name: Against PostgreSQL
        run: pnpm --filter @2tamago/api test:e2e
        env:
          TEST_DATABASE_URL: postgres://tamago:tamago@localhost:5432/tamago_test
      - name: Sessions against PostgreSQL (row locks, migrations), in a database of their own
        run: |
          PGPASSWORD=tamago psql -h localhost -U tamago -d tamago_test -c 'create database tamago_auth_test'
          pnpm --filter @2tamago/api test:e2e test/auth.e2e-spec.ts
        env:
          TEST_AUTH_DATABASE_URL: postgres://tamago:tamago@localhost:5432/tamago_auth_test

  e2e-web:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @2tamago/web exec playwright install --with-deps chromium
      - run: pnpm --filter @2tamago/web test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
